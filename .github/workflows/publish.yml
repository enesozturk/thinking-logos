name: Publish to npm

# Publishes the package on every git tag matching v* (e.g. v0.1.0, v1.0.0).
# `--provenance` requires `id-token: write` and a registry-url with HTTPS,
# and produces an attestation linking the tarball to this workflow run.

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # Publish; --access public is required for unscoped packages on a
      # personal account. NPM_TOKEN must be an npm "Automation" token with
      # publish rights to the thinking-logo package.
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
