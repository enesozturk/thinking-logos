name: Deploy demo to GitHub Pages

# Redeploys the demo whenever main changes.
#
# Gotcha, for whoever hits it next: this repository is a FORK, and GitHub
# disables push-triggered workflows on forks until they are explicitly
# enabled. The repo-level Actions toggle reads "enabled" the whole time, so
# nothing looks wrong — pushes simply never create a run, and the live site
# quietly serves whatever the last manual dispatch built. If the demo looks
# stale, check the asset hash in the deployed index.html against a local
# `pnpm build:demo` before assuming the code is wrong.

on:
  push:
    branches: [main]
    paths:
      - 'demo/**'
      - 'src/**'
      - 'vite.config.demo.ts'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  pages: write
  id-token: write
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:demo
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist-demo
      - id: deploy
        uses: actions/deploy-pages@v4
